<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Climeto GreenTrace Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runs before React — capture portal SSO token from /sso? or ?climeto_sso=1& -->
    <script>
      (function () {
        try {
          var TOKEN_KEY = "cpcb_auth_token";
          var USER_KEY = "cpcb_current_user";

          function normalizeToken(raw) {
            if (!raw) return null;
            var t = raw;
            try { t = decodeURIComponent(t); } catch (e) {}
            if (t.indexOf(" ") !== -1 && t.indexOf(".") !== -1) {
              var parts = t.split(".");
              if (parts.length === 3) {
                t = parts.map(function (p) { return p.replace(/ /g, "+"); }).join(".");
              }
            }
            return t;
          }

          function queryFromUrl() {
            var search = (window.location.search || "").replace(/^\?/, "");
            if (search && (search.indexOf("token=") !== -1 || search.indexOf("climeto_sso=1") !== -1)) {
              return search;
            }
            var hash = (window.location.hash || "").replace(/^#/, "");
            if (!hash) return "";
            var qi = hash.indexOf("?");
            if (qi !== -1) return hash.slice(qi + 1);
            if (hash.indexOf("token=") !== -1 || hash.indexOf("climeto_sso=1") !== -1) return hash;
            return "";
          }

          var qs = queryFromUrl();
          var token = qs ? new URLSearchParams(qs).get("token") : null;
          if (!token) {
            var m = window.location.href.match(/[?&#]token=([^&#]+)/);
            token = m ? m[1] : null;
          }
          token = normalizeToken(token);
          if (!token) return;

          var p = qs ? new URLSearchParams(qs) : new URLSearchParams();
          localStorage.setItem(p.get("tokenKey") || TOKEN_KEY, token);
          var user = p.get("currentUser");
          if (user) localStorage.setItem(p.get("userKey") || USER_KEY, user);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
