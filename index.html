<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Climeto GreenTrace Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runs before React bundle — portal SSO token must land in localStorage immediately -->
    <script>
      (function () {
        try {
          var TOKEN_KEY = "cpcb_auth_token";
          var USER_KEY = "cpcb_current_user";
          var hash = (window.location.hash || "").replace(/^#/, "");
          var search = (window.location.search || "").replace(/^\?/, "");
          var raw =
            hash && (hash.indexOf("climeto_sso=1") !== -1 || hash.indexOf("token=") !== -1)
              ? hash
              : search;
          if (!raw) return;
          if (raw.indexOf("climeto_sso=1") === -1 && raw.indexOf("token=") === -1) return;

          var p = new URLSearchParams(raw);
          var token = p.get("token");
          if (!token) return;

          if (token.indexOf(" ") !== -1 && token.indexOf(".") !== -1) {
            var parts = token.split(".");
            if (parts.length === 3) {
              token = parts.map(function (x) { return x.replace(/ /g, "+"); }).join(".");
            }
          }

          localStorage.setItem(p.get("tokenKey") || TOKEN_KEY, token);
          var user = p.get("currentUser");
          if (user) localStorage.setItem(p.get("userKey") || USER_KEY, user);

          var path = window.location.pathname === "/login" ? "/" : window.location.pathname;
          window.history.replaceState({}, "", path);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
