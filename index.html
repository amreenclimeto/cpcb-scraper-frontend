<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Climeto GreenTrace Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var TOKEN_KEY = "cpcb_auth_token";
          var USER_KEY = "cpcb_current_user";
          var href = window.location.href;
          if (href.indexOf("token=") === -1 && href.indexOf("climeto_sso=1") === -1) return;

          var m = href.match(/[?&#]token=(eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)/);
          var token = m ? m[1] : null;
          if (!token) return;

          if (token.indexOf(" ") !== -1) {
            var parts = token.split(".");
            if (parts.length === 3) {
              token = parts.map(function (p) { return p.replace(/ /g, "+"); }).join(".");
            }
          }

          localStorage.setItem(TOKEN_KEY, token);

          var qs = (window.location.search || "").replace(/^\?/, "");
          if (qs) {
            var p = new URLSearchParams(qs);
            var user = p.get("currentUser");
            if (user) localStorage.setItem(p.get("userKey") || USER_KEY, user);
          }

          var path = window.location.pathname;
          if (path === "/login" || path === "/sso") path = "/";
          window.history.replaceState({}, "", path);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
